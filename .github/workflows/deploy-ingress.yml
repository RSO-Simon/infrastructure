name: deploy-ingress

on:
  workflow_dispatch:
  push:
    paths:
      - "helm/ingress/**"
      - ".github/workflows/deploy-ingress.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Ensure rso namespace exists
        run: |
          kubectl create namespace rso --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy ingress (Helm)
        run: |
          helm upgrade --install rso-ingress ./helm/ingress --namespace rso

      - name: Show ingress status
        run: |
          kubectl -n rso get ingress -o wide
