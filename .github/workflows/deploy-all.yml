name: deploy-all

on:
  workflow_dispatch:
    inputs:
      shipImageTag:
        description: "ship-service image tag (commit SHA)"
        required: true
    componentImageTag:
      required: false
  repository_dispatch:
    types: [deploy-all]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - uses: azure/setup-helm@v4

      - run: helm upgrade --install postgres ./helm/postgres --namespace rso --create-namespace

      - name: Deploy ship-service
        env:
          TAG_FROM_MANUAL: ${{ inputs.shipImageTag }}
          TAG_FROM_DISPATCH: ${{ github.event.client_payload.shipImageTag }}
        run: |
          TAG="${TAG_FROM_MANUAL:-$TAG_FROM_DISPATCH}"
          helm upgrade --install ship-service ./helm/ship-service --namespace rso --set image.tag="$TAG"

      - name: Deploy component-service
        env:
          TAG_FROM_MANUAL: ${{ inputs.componentImageTag }}
          TAG_FROM_DISPATCH: ${{ github.event.client_payload.componentImageTag }}
        run: |
          TAG="${TAG_FROM_MANUAL:-$TAG_FROM_DISPATCH}"
          if [ -n "$TAG" ] && [ "$TAG" != "skip" ]; then
            helm upgrade --install component-service ./helm/component-service --namespace rso --set image.tag="$TAG"
          fi

      - run: kubectl -n rso get deploy,svc,pods
