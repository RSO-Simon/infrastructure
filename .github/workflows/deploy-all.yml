name: deploy-all

on:
  workflow_dispatch:
    inputs:
      shipImageTag:
        description: "ship-service image tag (commit SHA)"
        required: true
      componentImageTag:
        required: false


permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Azure secrets are present
        shell: bash
        run: |
          test -n "${{ secrets.AZURE_CLIENT_ID }}" || (echo "Missing AZURE_CLIENT_ID" && exit 1)
          test -n "${{ secrets.AZURE_TENANT_ID }}" || (echo "Missing AZURE_TENANT_ID" && exit 1)
          test -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" || (echo "Missing AZURE_SUBSCRIPTION_ID" && exit 1)
          echo "Azure secrets present."

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - uses: azure/setup-helm@v4

      - run: helm upgrade --install postgres ./helm/postgres --namespace rso --create-namespace

      - run: helm upgrade --install ship-service ./helm/ship-service --namespace rso --set image.tag=${{ inputs.shipImageTag }}

      - name: Deploy component-service
        if: ${{ inputs.componentImageTag != '' && inputs.componentImageTag != 'skip' }}
        run: helm upgrade --install component-service ./helm/component-service --namespace rso --set image.tag=${{ inputs.componentImageTag }}

      - run: kubectl -n rso get deploy,svc,pods
