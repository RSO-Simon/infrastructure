name: deploy-ship-service

on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: "Image tag to deploy (e.g. commit SHA)"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - uses: azure/setup-helm@v4

      - run: helm upgrade --install ship-service ./helm/ship-service --namespace rso --create-namespace --set image.tag=${{ inputs.imageTag }}

      - run: kubectl -n rso get deploy,svc,pods
