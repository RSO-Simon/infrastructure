replicaCount: 1

image:
  repository: ghcr.io/rso-simon/ship-service
  tag: ""
  pullPolicy: IfNotPresent
  pullSecret: ghcr-secret

service:
  type: ClusterIP
  port: 8081


probes:
  livenessPath: /api/ships/actuator/health/liveness
  readinessPath: /api/ships/actuator/health/readiness

db:
  host: postgres
  port: 5432
  name: appdb
  username: postgres
  password: pass

server:
  contextPath: /api/ships

resources: {}
