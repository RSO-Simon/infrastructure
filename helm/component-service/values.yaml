replicaCount: 1

image:
  repository: ghcr.io/rso-simon/component-service
  tag: ""
  pullPolicy: IfNotPresent
  pullSecret: ghcr-secret

service:
  type: ClusterIP
  port: 8082

probes:
  livenessPath: /api/components/actuator/health/liveness
  readinessPath: /api/components/actuator/health/readiness

db:
  host: postgres
  port: 5432
  name: appdb
  username: postgres
  password: pass

server:
  contextPath: /api/components

jwt:
  shared: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

resources: {}
