replicaCount: 1

image:
  repository: ghcr.io/RSO-Simon/component-service
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8082

# Canonical external base path for this service
contextPath: /api/components

env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/appdb
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: pass
  SERVER_FORWARD_HEADERS_STRATEGY: native
  SERVER_SERVLET_CONTEXT_PATH: /api/components

ingress:
  enabled: false
  className: nginx
  host: ""
  pathPrefix: /api/components
